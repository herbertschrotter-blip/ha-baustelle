# Dashboard „Baustelle“ – erzeugt mit tools/dashboard.py aus den Diagnose-Downloads der Integration.
# Nicht von Hand ändern: Generator anpassen und neu erzeugen.
title: Baustelle
views:
- title: Übersicht
  path: oewg-dobl-zwaring
  icon: mdi:crane
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Jetzt
      icon: mdi:crane
    - type: tile
      entity: sensor.owg_dobl_zwaring_status
      grid_options:
        columns: 12
    - type: tile
      entity: switch.owg_dobl_zwaring_automatik
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.owg_dobl_zwaring_nachste_schaltzeit
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.owg_dobl_zwaring_aussentemperatur
      grid_options:
        columns: 4
      name: Außen
    - type: tile
      entity: sensor.owg_dobl_zwaring_regen
      grid_options:
        columns: 4
      name: Regen
    - type: tile
      entity: sensor.owg_dobl_zwaring_fruh_prognose
      grid_options:
        columns: 4
      name: Früh
  - type: grid
    cards:
    - type: heading
      heading: Warnungen
      icon: mdi:alert
    - type: tile
      entity: binary_sensor.owg_dobl_zwaring_erreichbar
      grid_options:
        columns: 12
      name: Baustelle erreichbar
      visibility:
      - condition: state
        entity: binary_sensor.owg_dobl_zwaring_erreichbar
        state: 'off'
    - type: tile
      entity: binary_sensor.heizung_01_radiator_1_problem
      grid_options:
        columns: 12
      visibility:
      - condition: state
        entity: binary_sensor.heizung_01_radiator_1_problem
        state: 'on'
    - type: markdown
      content: ✓ Keine Warnungen.
      grid_options:
        columns: full
      visibility:
      - condition: state
        entity: binary_sensor.heizung_01_radiator_1_problem
        state_not: 'on'
  - type: grid
    cards:
    - type: heading
      heading: Verbrauch heute
      icon: mdi:lightning-bolt
    - type: statistic
      entity: sensor.owg_dobl_zwaring_energie
      name: Energie heute
      stat_type: change
      period:
        calendar:
          period: day
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.owg_dobl_zwaring_kosten
      name: Kosten heute
      stat_type: change
      period:
        calendar:
          period: day
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.owg_dobl_zwaring_leistung
      grid_options:
        columns: 12
      name: Leistung jetzt
  - type: grid
    cards:
    - type: heading
      heading: Container
      icon: mdi:home-group
    - type: tile
      entity: sensor.poliercontainer_heizung
      grid_options:
        columns: 6
      name: Poliercontainer
  - type: grid
    cards:
    - type: heading
      heading: Heute
      icon: mdi:chart-timeline
    - type: history-graph
      title: Wann geheizt und gepumpt wird
      hours_to_show: 24
      entities:
      - entity: switch.heizung_01_aioshelly_ble_integration
        name: Radiator 1 (Poliercontainer)
      grid_options:
        columns: full
        rows: 4
    column_span: 3
- title: Heizung
  path: oewg-dobl-zwaring-heizung
  icon: mdi:radiator
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Automatik
      icon: mdi:radiator
    - type: tile
      entity: switch.owg_dobl_zwaring_automatik
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.owg_dobl_zwaring_status
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.owg_dobl_zwaring_nachste_schaltzeit
      grid_options:
        columns: 6
  - type: grid
    cards:
    - type: heading
      heading: Poliercontainer
      icon: mdi:home-thermometer
      badges: []
    - type: tile
      entity: select.poliercontainer_modus
      grid_options:
        columns: 12
      name: Modus
      features:
      - type: select-options
      features_position: inline
    - type: tile
      entity: switch.poliercontainer_kleidung_trocknen
      grid_options:
        columns: 12
      name: Kleidung trocknen nach Regen
    - type: tile
      entity: sensor.poliercontainer_heizung
      grid_options:
        columns: 12
      name: Heizung
    - type: tile
      entity: switch.heizung_01_aioshelly_ble_integration
      grid_options:
        columns: 6
      name: Radiator 1
    - type: heading
      heading: Von Hand schalten stellt den Container auf „Hand“.
      heading_style: subtitle
  - type: grid
    cards:
    - type: heading
      heading: Zeitplan je Tag
      icon: mdi:calendar-clock
    - type: entities
      entities:
      - type: section
        label: Montag
      - switch.owg_dobl_zwaring_montag_aktiv
      - time.owg_dobl_zwaring_montag_ein
      - time.owg_dobl_zwaring_montag_aus
      - type: section
        label: Dienstag
      - switch.owg_dobl_zwaring_dienstag_aktiv
      - time.owg_dobl_zwaring_dienstag_ein
      - time.owg_dobl_zwaring_dienstag_aus
      - type: section
        label: Mittwoch
      - switch.owg_dobl_zwaring_mittwoch_aktiv
      - time.owg_dobl_zwaring_mittwoch_ein
      - time.owg_dobl_zwaring_mittwoch_aus
      - type: section
        label: Donnerstag
      - switch.owg_dobl_zwaring_donnerstag_aktiv
      - time.owg_dobl_zwaring_donnerstag_ein
      - time.owg_dobl_zwaring_donnerstag_aus
      - type: section
        label: Freitag
      - switch.owg_dobl_zwaring_freitag_aktiv
      - time.owg_dobl_zwaring_freitag_ein
      - time.owg_dobl_zwaring_freitag_aus
      - type: section
        label: Samstag
      - switch.owg_dobl_zwaring_samstag_aktiv
      - time.owg_dobl_zwaring_samstag_ein
      - time.owg_dobl_zwaring_samstag_aus
      - type: section
        label: Sonntag
      - switch.owg_dobl_zwaring_sonntag_aktiv
      - time.owg_dobl_zwaring_sonntag_ein
      - time.owg_dobl_zwaring_sonntag_aus
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Regeln
      icon: mdi:tune
    - type: entities
      entities:
      - number.owg_dobl_zwaring_kleidung_trocknen_ab_regen
      - number.owg_dobl_zwaring_kleidung_trocknen_abends_langer
      - number.owg_dobl_zwaring_kleidung_trocknen_fruher_starten
      grid_options:
        columns: full
      title: Kleidung trocknen nach Regen
    - type: entities
      entities:
      - number.owg_dobl_zwaring_kalte_fruh_prognose_unter
      - number.owg_dobl_zwaring_kalte_fruher_ein_um
      grid_options:
        columns: full
      title: Bei Kälte früher ein
    - type: entities
      entities:
      - switch.owg_dobl_zwaring_heizgrenze
      - number.owg_dobl_zwaring_heizgrenze_aus_uber
      - select.owg_dobl_zwaring_heizgrenze_nach
      grid_options:
        columns: full
      title: Heizgrenze – zu warm
    - type: entities
      entities:
      - switch.owg_dobl_zwaring_frostschutz
      - number.owg_dobl_zwaring_frostschutz_ein_unter
      - number.owg_dobl_zwaring_frostschutz_aus_uber
      grid_options:
        columns: full
      title: Frostschutz
    - type: entities
      entities:
      - select.owg_dobl_zwaring_im_urlaub_an_feiertagen
      - number.owg_dobl_zwaring_absenktemperatur
      grid_options:
        columns: full
      title: Urlaub und Feiertage
- title: Auswertung
  path: oewg-dobl-zwaring-auswertung
  icon: mdi:chart-box
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Verbrauch und Kosten
      icon: mdi:lightning-bolt
    - type: statistic
      entity: sensor.owg_dobl_zwaring_energie
      name: Energie diese Woche
      stat_type: change
      period:
        calendar:
          period: week
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.owg_dobl_zwaring_kosten
      name: Kosten diese Woche
      stat_type: change
      period:
        calendar:
          period: week
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.owg_dobl_zwaring_energie
      name: Energie dieser Monat
      stat_type: change
      period:
        calendar:
          period: month
      grid_options:
        columns: 6
    - type: statistic
      entity: sensor.owg_dobl_zwaring_kosten
      name: Kosten dieser Monat
      stat_type: change
      period:
        calendar:
          period: month
      grid_options:
        columns: 6
    - type: tile
      entity: sensor.owg_dobl_zwaring_energie
      grid_options:
        columns: 6
      name: Energie gesamt
    - type: tile
      entity: sensor.owg_dobl_zwaring_kosten
      grid_options:
        columns: 6
      name: Kosten gesamt
  - type: grid
    cards:
    - type: heading
      heading: Mit Automatik und ohne
      icon: mdi:piggy-bank
    - type: tile
      entity: sensor.owg_dobl_zwaring_ersparnis_durch_automatik
      grid_options:
        columns: 12
      name: Ersparnis
    - type: tile
      entity: sensor.owg_dobl_zwaring_energie_ohne_automatik_24_7
      grid_options:
        columns: 12
      name: Ohne Automatik (24/7)
    - type: tile
      entity: sensor.owg_dobl_zwaring_heizperiode_hochgerechnet
      grid_options:
        columns: 6
      name: Heizperiode hochgerechnet
    - type: tile
      entity: sensor.owg_dobl_zwaring_heizperiode_hochgerechnet_kosten
      grid_options:
        columns: 6
      name: … in Euro
    - type: tile
      entity: sensor.owg_dobl_zwaring_heizperiode_ohne_automatik
      grid_options:
        columns: 12
      name: Heizperiode ohne Automatik
    - type: entities
      entities:
      - number.owg_dobl_zwaring_strompreis
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Verbrauch je Tag
      icon: mdi:chart-bar
    - type: statistics-graph
      title: Energie je Container (kWh)
      period: day
      days_to_show: 14
      stat_types:
      - change
      chart_type: bar
      entities:
      - entity: sensor.poliercontainer_energie
        name: Poliercontainer
        color: '#2a78d6'
      grid_options:
        columns: full
        rows: 5
    - type: statistics-graph
      title: Heizzeit je Container (h)
      period: day
      days_to_show: 14
      stat_types:
      - change
      chart_type: bar
      entities:
      - entity: sensor.poliercontainer_heizzeit
        name: Poliercontainer
        color: '#2a78d6'
      grid_options:
        columns: full
        rows: 5
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Verlauf
      icon: mdi:chart-line
    - type: history-graph
      title: Leistung
      hours_to_show: 48
      entities:
      - entity: sensor.owg_dobl_zwaring_leistung
        name: Baustelle
      - entity: sensor.poliercontainer_leistung
        name: Poliercontainer
      grid_options:
        columns: full
        rows: 4
    - type: history-graph
      title: Temperaturen
      hours_to_show: 48
      entities:
      - entity: sensor.owg_dobl_zwaring_aussentemperatur
        name: Außen
      grid_options:
        columns: full
        rows: 4
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Ölradiator ↔ Konvektor
      icon: mdi:scale-balance
    - type: heading
      heading: Pro kWh liefern beide gleich viel Wärme – Unterschiede kommen von Leistung, Laufzeit und Wärmespeicherung.
      heading_style: subtitle
    - type: tile
      entity: sensor.owg_dobl_zwaring_o_leistung_olradiator
      grid_options:
        columns: 6
      name: Ø Leistung Ölradiator
    - type: tile
      entity: sensor.owg_dobl_zwaring_o_leistung_konvektor
      grid_options:
        columns: 6
      name: Ø Leistung Konvektor
    - type: statistics-graph
      title: Energie je Typ (kWh)
      period: day
      days_to_show: 14
      stat_types:
      - change
      chart_type: bar
      entities:
      - entity: sensor.owg_dobl_zwaring_energie_olradiatoren
        name: Ölradiator
        color: '#2a78d6'
      - entity: sensor.owg_dobl_zwaring_energie_konvektoren
        name: Konvektor
        color: '#eb6834'
      grid_options:
        columns: full
        rows: 5
    - type: statistics-graph
      title: Heizzeit je Typ (h)
      period: day
      days_to_show: 14
      stat_types:
      - change
      chart_type: bar
      entities:
      - entity: sensor.owg_dobl_zwaring_heizzeit_olradiatoren
        name: Ölradiator
        color: '#2a78d6'
      - entity: sensor.owg_dobl_zwaring_heizzeit_konvektoren
        name: Konvektor
        color: '#eb6834'
      grid_options:
        columns: full
        rows: 5
- title: Verlauf
  path: verlauf
  icon: mdi:history
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Alle Baustellen je Monat
      icon: mdi:chart-bar
    - type: statistics-graph
      title: Energie je Baustelle (kWh)
      period: month
      days_to_show: 730
      stat_types:
      - change
      chart_type: bar
      entities:
      - entity: sensor.owg_dobl_zwaring_energie
        name: ÖWG Dobl Zwaring
        color: '#2a78d6'
      grid_options:
        columns: full
        rows: 5
    - type: statistics-graph
      title: Kosten je Baustelle
      period: month
      days_to_show: 730
      stat_types:
      - change
      chart_type: bar
      entities:
      - entity: sensor.owg_dobl_zwaring_kosten
        name: ÖWG Dobl Zwaring
        color: '#2a78d6'
      grid_options:
        columns: full
        rows: 5
    column_span: 2
  - type: grid
    cards:
    - type: heading
      heading: Summen
      icon: mdi:sigma
    - type: entities
      entities:
      - type: section
        label: ÖWG Dobl Zwaring (aktiv)
      - sensor.owg_dobl_zwaring_energie
      - sensor.owg_dobl_zwaring_kosten
      - sensor.owg_dobl_zwaring_ersparnis_durch_automatik
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Verwaltung
      icon: mdi:cog
    - type: markdown
      grid_options:
        columns: full
      content: 'Baustellen, Container und Shellys verwaltest du unter [Einstellungen → Geräte & Dienste → Baustelle](/config/integrations/integration/baustelle).


        „Konfigurieren“ je Baustelle: Status aktiv/abgeschlossen, Wetter, Kalender, Meldungen, Heizperiode.'
