<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ha-baustelle Dashboard — Entwurf v4</title>
<style>
/* Designquelle: HA-Standard-Theme (hell/dunkel), nachgebildet. Kein eigenes Theme – im echten Dashboard
   kommen alle Farben aus HA. Werte sind Platzhalter. */
:root {
  --primary-color: #03a9f4;
  --accent-color: #ff9800;
  --primary-background-color: #fafafa;
  --secondary-background-color: #e5e5e5;
  --card-background-color: #ffffff;
  --primary-text-color: #212121;
  --secondary-text-color: #727272;
  --divider-color: rgba(0, 0, 0, .12);
  --app-header-background-color: #03a9f4;
  --app-header-text-color: #ffffff;
  --state-heat: #ff8100;
  --state-on: #ffc107;
  --success-color: #43a047;
  --warning-color: #ffa600;
  --error-color: #db4437;
  --info-color: #039be5;
  --ha-card-border-radius: 12px;
  --ha-card-border: 1px solid #e0e0e0;
  --tag-bg: #eceff1;
}
[data-theme="dark"] {
  --primary-background-color: #111111;
  --secondary-background-color: #282828;
  --card-background-color: #1c1c1c;
  --primary-text-color: #e1e1e1;
  --secondary-text-color: #9b9b9b;
  --divider-color: rgba(225, 225, 225, .12);
  --app-header-background-color: #101e24;
  --app-header-text-color: #e1e1e1;
  --ha-card-border: 1px solid rgba(225, 225, 225, .12);
  --tag-bg: #2c3437;
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px;
  background: #cfd8dc; color: var(--primary-text-color);
}
[data-theme="dark"] body, body[data-theme="dark"] { background: #000; }

/* Rahmen der Entwurfsseite */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #263238; color: #eceff1; }
.bar b { margin-right: 12px; }
.bar button { border: 1px solid #546e7a; background: transparent; color: inherit; padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
.bar button.on { background: #eceff1; color: #263238; }
.bar .note { opacity: .7; font-size: 12px; margin-left: auto; }
.stage { display: flex; gap: 24px; padding: 16px; align-items: flex-start; overflow-x: auto; }
.frame-wrap { flex: 0 0 auto; }
.frame-wrap h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: #37474f; }
[data-theme="dark"] .frame-wrap h4 { color: #90a4ae; }
.frame { background: var(--primary-background-color); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,.25); container-type: inline-size; }
.frame.desktop { width: 1180px; }
.frame.phone { width: 390px; border-radius: 28px; border: 8px solid #111; }
.stage.only-desktop .frame-wrap.phone, .stage.only-phone .frame-wrap.desktop { display: none; }

/* HA-Kopfzeile mit Ansichts-Tabs */
.hdr { background: var(--app-header-background-color); color: var(--app-header-text-color); }
.hdr-top { display: flex; align-items: center; gap: 12px; height: 48px; padding: 0 12px; font-size: 20px; }
.hdr-top .ico { width: 24px; text-align: center; opacity: .9; }
.hdr-top .t { flex: 1; }
.tabs { display: flex; overflow-x: auto; padding: 0 4px; }
.tab { padding: 10px 14px; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; border-bottom: 2px solid transparent; opacity: .75; white-space: nowrap; }
.tab.on { border-bottom-color: currentColor; opacity: 1; }

/* Abschnitte-Ansicht (sections view) */
.view { display: none; padding: 16px; }
.view.on { display: block; }
.sections { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.sec { display: flex; flex-direction: column; gap: 8px; }
.sec.span2 { grid-column: span 2; }
.sec.span3 { grid-column: 1 / -1; }
@container (max-width: 700px) {
  .sections { grid-template-columns: 1fr; }
  .sec.span2, .sec.span3 { grid-column: auto; }
  .view { padding: 8px; }
  .grid2 { grid-template-columns: 1fr 1fr; }
  .week .row { grid-template-columns: 34px 1fr 1fr 44px; }
  .hide-phone { display: none !important; }
}
.heading { display: flex; align-items: baseline; gap: 8px; padding: 8px 4px 0; font-size: 16px; font-weight: 500; }
.heading .sub { margin-left: auto; font-size: 13px; color: var(--secondary-text-color); font-weight: 400; }
.card { position: relative; background: var(--card-background-color); border: var(--ha-card-border); border-radius: var(--ha-card-border-radius); padding: 12px; }
.card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 500; }
.ctype { display: none; position: absolute; top: 4px; right: 6px; font: 10px/1.4 ui-monospace, monospace; background: var(--tag-bg); color: var(--secondary-text-color); padding: 0 5px; border-radius: 4px; }
.show-types .ctype { display: block; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* Kachel (tile card) */
.tile { position: relative; display: flex; align-items: center; gap: 10px; background: var(--card-background-color); border: var(--ha-card-border); border-radius: var(--ha-card-border-radius); padding: 10px; min-height: 56px; }
.tile .ic { flex: 0 0 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; background: rgba(127,127,127,.15); }
.tile.heat .ic { background: rgba(255,129,0,.2); color: var(--state-heat); }
.tile.ok .ic { background: rgba(67,160,71,.18); color: var(--success-color); }
.tile.bad .ic { background: rgba(219,68,55,.18); color: var(--error-color); }
.tile.info .ic { background: rgba(3,155,229,.18); color: var(--info-color); }
.tile .tx { flex: 1; min-width: 0; }
.tile .n { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .s { color: var(--secondary-text-color); font-size: 12px; }
.tile .ctype { top: auto; bottom: 3px; }

.tgl { flex: 0 0 auto; width: 36px; height: 20px; border-radius: 10px; background: #9e9e9e; position: relative; cursor: pointer; }
.tgl::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.tgl.on { background: var(--primary-color); }
.tgl.on::after { left: 18px; }

/* Zeilen (entities card) */
.rows { display: flex; flex-direction: column; }
.r { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--divider-color); }
.r:first-child { border-top: 0; }
.r .ic { width: 24px; text-align: center; color: var(--secondary-text-color); }
.r .l { flex: 1; min-width: 0; }
.r .l small { display: block; color: var(--secondary-text-color); font-size: 12px; }
.r .v { color: var(--secondary-text-color); white-space: nowrap; }
.inp { border: 1px solid var(--divider-color); border-radius: 6px; padding: 4px 8px; background: transparent; color: var(--primary-text-color); font: inherit; width: 76px; text-align: center; }
.slider { width: 110px; accent-color: var(--primary-color); }

.big { font-size: 28px; font-weight: 400; }
.muted { color: var(--secondary-text-color); }
.warnc { border-left: 4px solid var(--warning-color); }
.errc { border-left: 4px solid var(--error-color); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: rgba(255,129,0,.18); color: var(--state-heat); }
.pill.blue { background: rgba(3,155,229,.15); color: var(--info-color); }
.pill.grey { background: rgba(127,127,127,.15); color: var(--secondary-text-color); }

/* Wochenplan */
.week .row { display: grid; grid-template-columns: 40px 1fr 1fr 1fr 44px; gap: 8px; align-items: center; padding: 5px 0; border-top: 1px solid var(--divider-color); }
.week .row.h { border-top: 0; font-size: 12px; color: var(--secondary-text-color); }
.week .inp { width: 100%; }
.tl { position: relative; height: 10px; border-radius: 5px; background: rgba(127,127,127,.18); }
.tl i { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--state-heat); }
.tl i.ext { background: repeating-linear-gradient(45deg, var(--state-heat) 0 4px, transparent 4px 8px); }
.tl i.pre { background: repeating-linear-gradient(45deg, var(--info-color) 0 4px, transparent 4px 8px); }

/* Diagramme (statistics-graph nachgebildet) */
.bars { display: flex; align-items: flex-end; gap: 4px; height: 140px; padding-top: 8px; }
.bars .b { flex: 1; display: flex; flex-direction: column-reverse; min-width: 6px; }
.bars .b span { display: block; }
.xlab { display: flex; gap: 4px; font-size: 10px; color: var(--secondary-text-color); }
.xlab span { flex: 1; text-align: center; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--secondary-text-color); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.c1 { background: #03a9f4; } .c2 { background: #ff9800; } .c3 { background: #8e24aa; }
.hbar { height: 10px; border-radius: 5px; background: rgba(127,127,127,.18); overflow: hidden; }
.hbar i { display: block; height: 100%; }
svg.line { width: 100%; height: 140px; }
.bar.sim { background: #37474f; font-size: 13px; }
.bar.sim label { display: flex; align-items: center; gap: 6px; }
.bar.sim input[type=range] { width: 110px; accent-color: #4fc3f7; }
.bar.sim select { font: inherit; }
.bar.sim span { min-width: 52px; font-variant-numeric: tabular-nums; }
.tgl, [data-v], [data-goto] { user-select: none; }
.inp:disabled { opacity: .4; }
.tile .s i { font-style: normal; opacity: .8; }
.bar.sim { background: #37474f; font-size: 13px; }
.bar.sim label { display: flex; align-items: center; gap: 6px; }
.bar.sim input[type=range] { width: 100px; accent-color: #4fc3f7; }
.bar.sim select, .bar select { font: inherit; }
.bar.sim span { min-width: 48px; font-variant-numeric: tabular-nums; }
.tgl, [data-act] { user-select: none; cursor: pointer; }
.inp:disabled, .dis { opacity: .45; pointer-events: none; }
.tile .s i { font-style: normal; opacity: .8; }
select.inp { width: auto; text-align: left; }
.inp.wide { width: 100%; text-align: left; }
.btn { border: 0; border-radius: 18px; padding: 6px 14px; font: inherit; font-weight: 500; cursor: pointer; background: var(--primary-color); color: #fff; }
.btn.flat { background: transparent; color: var(--primary-color); }
.btn.warn { background: var(--error-color); }
.btn.small { padding: 3px 10px; font-size: 12px; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 9px; background: rgba(3,169,244,.15); color: var(--info-color); margin-right: 4px; }
.chip.grey { background: rgba(127,127,127,.15); color: var(--secondary-text-color); }
.chip.red { background: rgba(219,68,55,.15); color: var(--error-color); }
.form { background: rgba(3,169,244,.06); border: 1px dashed var(--primary-color); border-radius: 10px; padding: 10px; margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--secondary-text-color); }
.form .act { display: flex; gap: 8px; justify-content: flex-end; }
.bsel { display: flex; align-items: center; gap: 10px; }
.bsel select { font: inherit; font-size: 15px; font-weight: 500; border: 0; background: transparent; color: var(--primary-text-color); flex: 1; }
.info-card { background: rgba(3,169,244,.08); border: 1px solid rgba(3,169,244,.3); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 10px 18px; border-radius: 6px; z-index: 9; display: none; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 6px 4px; text-align: right; border-top: 1px solid var(--divider-color); white-space: nowrap; }
table.t th { color: var(--secondary-text-color); font-weight: 500; border-top: 0; }
table.t td:first-child, table.t th:first-child { text-align: left; }
.save { color: var(--success-color); font-weight: 600; }

/* HA-Sidebar im Rahmen */
.shell { display: flex; min-height: 760px; position: relative; }
.side { flex: 0 0 210px; background: var(--card-background-color); border-right: 1px solid var(--divider-color); padding: 8px 0; }
.side .ttl { padding: 8px 16px 14px; font-size: 18px; }
.side .it { display: flex; gap: 14px; align-items: center; padding: 9px 16px; color: var(--secondary-text-color); cursor: pointer; border-radius: 0 20px 20px 0; margin-right: 8px; }
.side .it.on { background: rgba(3,169,244,.14); color: var(--primary-color); font-weight: 500; }
.side .it.ours { color: var(--primary-text-color); }
.side .it .i { width: 22px; text-align: center; }
.side hr { border: 0; border-top: 1px solid var(--divider-color); margin: 6px 0; }
.main { flex: 1; min-width: 0; }
.frame.phone .side { display: none; position: absolute; top: 0; left: 0; bottom: 0; z-index: 5; box-shadow: 4px 0 18px rgba(0,0,0,.3); }
.frame.phone .side.open { display: block; }

/* Animierte Geräte (im echten Dashboard nur mit eigener Karte) */
.dev { display: flex; gap: 10px; align-items: center; background: var(--card-background-color); border: var(--ha-card-border); border-radius: var(--ha-card-border-radius); padding: 8px 10px; position: relative; }
.dev.bad { border-color: var(--error-color); }
.dev svg.a { flex: 0 0 52px; width: 52px; height: 52px; }
.dev .tx { flex: 1; min-width: 0; }
.dev .n { font-weight: 500; }
.dev .s { color: var(--secondary-text-color); font-size: 12px; }
.dev .ctype { top: auto; bottom: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes rise { 0% { transform: translateY(5px); opacity: 0; } 40% { opacity: .9; } 100% { transform: translateY(-7px); opacity: 0; } }
@keyframes flow { to { stroke-dashoffset: -12; } }
@keyframes glow { 50% { opacity: .65; } }
@keyframes blink { 50% { opacity: .2; } }
.run .spin { transform-box: fill-box; transform-origin: center; animation: spin .9s linear infinite; }
.run .spin.slow { animation-duration: 1.6s; }
.wave { opacity: 0; }
.run .wave { animation: rise 1.8s ease-in infinite; }
.run .wave.d2 { animation-delay: .6s; } .run .wave.d3 { animation-delay: 1.2s; }
.run .flow { stroke-dasharray: 3 3; animation: flow .5s linear infinite; }
.run .glow { animation: glow 2.2s ease-in-out infinite; }
.alarm .blink { animation: blink 1s steps(2) infinite; }
@media (prefers-reduced-motion: reduce) { .run *, .alarm * { animation: none !important; } .wave { opacity: .7; } }

/* Diagramm-Palette: validiert (hell auf #fff, dunkel auf #1c1c1c) – Kategorie-Reihenfolge fest */
.frame { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300;
  --crit: #d03b3b; --muted: #898781; --gridc: #e1e0d9; --axisc: #c3c2b7; --ink2: #52514e; }
[data-theme="dark"] .frame { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300;
  --gridc: #2c2c2a; --axisc: #383835; --ink2: #c3c2b7; }
svg.ch { width: 100%; height: auto; display: block; overflow: visible; font-family: inherit; }
svg.ch .grid { stroke: var(--gridc); stroke-width: 1; }
svg.ch .base { stroke: var(--axisc); stroke-width: 1; }
svg.ch .yt { font-size: 10px; fill: var(--muted); text-anchor: end; font-variant-numeric: tabular-nums; }
svg.ch .xt { font-size: 10px; fill: var(--muted); text-anchor: middle; }
svg.ch .un { font-size: 10px; fill: var(--muted); }
svg.ch .rl { font-size: 11px; fill: var(--ink2); text-anchor: end; }
svg.ch .lane { fill: var(--gridc); opacity: .5; }
svg.ch .refl { stroke: var(--crit); stroke-width: 1; }
svg.ch .reft { font-size: 10px; fill: var(--ink2); text-anchor: end; }
svg.ch .now { stroke: var(--primary-text-color); stroke-width: 1.5; }
svg.ch .now-t { fill: var(--primary-text-color); font-weight: 600; }
svg.ch .cross { stroke: var(--muted); stroke-width: 1; pointer-events: none; }
svg.ch .ring { stroke: var(--card-background-color); stroke-width: 2; }
svg.ch .mk { cursor: default; transition: opacity .1s; }
svg.ch .mk:hover { opacity: .75; }
.lg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); margin-top: 8px; }
.lg i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; background: var(--c); }
.lg i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.lg i.dash { background: repeating-linear-gradient(90deg, var(--c) 0 4px, transparent 4px 7px); }
.lg i.hatch { background: repeating-linear-gradient(45deg, var(--c) 0 2px, transparent 2px 5px); border: 1px solid var(--c); }
.tip { position: fixed; z-index: 20; display: none; pointer-events: none; background: var(--card-background-color, #fff); color: var(--primary-text-color, #212121);
  border: 1px solid rgba(127,127,127,.3); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 260px; }
.tip .tr { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tip .tr i { width: 12px; height: 2px; border-radius: 1px; flex: 0 0 auto; }
.tip .tr span { color: var(--secondary-text-color, #727272); }
.stat { position: relative; background: var(--card-background-color); border: var(--ha-card-border); border-radius: var(--ha-card-border-radius); padding: 12px 14px; }
.stat .sl { font-size: 13px; color: var(--secondary-text-color); }
.stat .sv { font-size: 24px; font-weight: 600; margin: 2px 0; }
.stat .ss { font-size: 12px; color: var(--secondary-text-color); }
</style>
</head>
<body>
<div class="bar">
  <b>Baustelle – Dashboard-Entwurf v4</b>
  <button data-mode="both" class="on">Desktop + 390 px</button>
  <button data-mode="only-desktop">Nur Desktop</button>
  <button data-mode="only-phone">Nur 390 px</button>
  <label>Navigation <select id="nav"><option value="tabs">Tabs je Funktion (1 Sidebar-Eintrag)</option><option value="side">Sidebar-Eintrag je Funktion</option></select></label>
  <button id="theme">Hell / Dunkel</button>
  <button id="types">Kartentypen zeigen</button>
  <span class="note">Entwurf: Namen und Werte sind Platzhalter · Eingaben bleiben in diesem Browser gespeichert</span>
</div>
<div class="bar sim">
  <b>Simulation</b>
  <label>Datum <input type="date" data-simd="date" style="font:inherit"></label><span data-simv="wd" style="min-width:24px"></span>
  <label>Uhrzeit <input type="range" min="0" max="1439" step="5" data-sim="time"><span data-simv="time"></span></label>
  <label>Regen 24 h <input type="range" min="0" max="20" step="0.2" data-sim="rain"><span data-simv="rain"></span></label>
  <label>Außen <input type="range" min="-10" max="30" step="0.5" data-sim="out"><span data-simv="out"></span></label>
  <label>Früh-Prognose <input type="range" min="-10" max="12" step="0.5" data-sim="fc"><span data-simv="fc"></span></label>
  <label>Innen ± <input type="range" min="-15" max="6" step="0.5" data-sim="dT"><span data-simv="dT"></span></label>
  <label><input type="checkbox" data-simc="outage"> Stromausfall</label>
  <label><input type="checkbox" data-simc="dry"> Pumpe 1 trocken</label>
  <button id="reset">Alles zurücksetzen</button>
</div>

<div class="stage" id="stage">
  <div class="frame-wrap desktop"><h4>Desktop</h4><div class="frame desktop"></div></div>
  <div class="frame-wrap phone"><h4>Smartphone 390 px</h4><div class="frame phone"></div></div>
</div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip" role="tooltip"></div>

<script>
/* =========================================================================================
   Zustand. In HA später: Baustellen/Bereiche/Geräte = Einträge der Integration (.storage),
   Messwerte = Langzeitstatistik (Recorder). Hier nur im Browser (localStorage).
   ========================================================================================= */
const LS = 'ha-baustelle-mockup-v6';
const TAGE = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const MON = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const ROLLE = { heat: 'Heizkörper', dry: 'Bautrockner', pump: 'Pumpe', plug: 'Steckdose' };
const HTYP = { oel: 'Ölradiator', konv: 'Konvektor' };
const STDW = { heat: 2000, dry: 1800, pump: 750, plug: 500 };
const POOL = [
  ...['a1f3', 'b27c', 'c90e', 'd4a1', 'e5b2', 'f6c3', '17d4', '28e5', '39f6', '4a07', '5b18', '6c29', '7d3a', '8e4b'].map(k => ({ e: 'switch.shellyplugs_' + k, n: 'Shelly Plug S ' + k, t: 'switch' })),
  ...['7c21', '9d02', 'ae13', 'bf24', 'c035'].map(k => ({ e: 'sensor.shellyht_' + k + '_temperatur', n: 'Shelly H&T ' + k, t: 'temp' })),
  { e: 'climate.thermostat_polier', n: 'Thermostat Polier (Gerät)', t: 'climate' },
  { e: 'weather.baustelle_nord', n: 'Met.no – Baustelle Nord', t: 'weather' }, { e: 'weather.forecast_home', n: 'Met.no – Zuhause', t: 'weather' },
  { e: 'sensor.wetterstation_sued_temperatur', n: 'Wetterstation Süd – Temperatur', t: 'wtemp' }, { e: 'sensor.wetterstation_sued_regen_24h', n: 'Wetterstation Süd – Regen 24 h', t: 'wrain' },

      else if (a.mode === 'hand') { st.on = d.man; st.src = 'Hand'; }

function usage(b, scope) {
  const areas = scope === 'all' ? b.areas : b.areas.filter(a => a.id === scope);
  const devs = areas.flatMap(a => a.dev);
  const heat = devs.filter(d => d.role === 'heat' || d.role === 'dry');
  const M = months(b.season);
  const mon = devs.reduce((s, d) => s + d.mon, 0), day = devs.reduce((s, d) => s + d.kwh, 0);
  const hMon = heat.reduce((s, d) => s + d.mon, 0);
  const full = heat.reduce((s, d) => s + d.w, 0) * 24 / 1000;
  return { areas, devs, heat, M, mon, day, week: mon / 29 * 7, rows: [
    ['Tag', heat.reduce((s, d) => s + d.kwh, 0), full],
    ['Woche', hMon / 29 * 7, full * 7],
    ['Monat', hMon, full * 30],
    [`Heizperiode (${MON[b.season[0] - 1]}–${MON[b.season[1] - 1]}, ${M} Mon.)`, hMon * M, full * 30 * M]] };
}

/* =========================================================================================
   Diagramme. In HA später: history-graph (Zeitleiste/Temperaturen), statistics-graph
   (kWh je Tag aus Energiezählern, Heiz-/Pumpzeit aus history_stats-Sensoren).
   Farben: Kategorie-Palette (geprüft: Farbenblindheit/Kontrast), Farbe folgt dem Container.
   ========================================================================================= */
const CX = {};                                   // Fadenkreuz-Daten je Diagramm
const hash = str => { let h = 7; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 100003; return h; };
const rnd = (str) => (hash(str) % 1000) / 1000;
const niceMax = v => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; };
const sc = i => `var(--s${(i % 6) + 1})`;
const legend = (items, kind = 'rect') => `<div class="lg">${items.map(([n, c, extra]) => `<span><i class="${kind}${extra ? ' ' + extra : ''}" style="--c:${c}"></i>${esc(n)}</span>`).join('')}</div>`;
const rtop = (x, y, w, h, r) => { r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; };

/* Säulen, gestapelt oder gruppiert */
function colChart({ id, W, H = 190, labels, series, stack, unit, dec = 1 }) {
  const L = 40, R = 6, T = 10, Bm = 24, pw = W - L - R, ph = H - T - Bm, n = labels.length;
  const max = niceMax(Math.max(...labels.map((_, i) => stack ? series.reduce((s, q) => s + (q.values[i] || 0), 0) : Math.max(...series.map(q => q.values[i] || 0))), 0.1));
  const y = v => T + ph - v / max * ph, band = pw / n;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${k ? 'grid' : 'base'}"/><text x="${L - 6}" y="${y(v) + 3}" class="yt">${de(v, v < 10 && max < 10 ? 1 : 0)}</text>`; }
  const step = Math.ceil(n / (W < 400 ? 6 : 12));
  labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${L + band * i + band / 2}" y="${H - 8}" class="xt">${esc(l)}</text>`; });
  let bars = '';
  labels.forEach((l, i) => {
    const cx = L + band * i + band / 2;
    if (stack) {
      const bw = Math.min(24, band * .62); let acc = 0; const vals = series.map(q => q.values[i] || 0); const top = vals.map((v, k) => v > 0 ? k : -1).filter(k => k >= 0).pop();
      series.forEach((q, k) => { const v = vals[k]; if (v <= 0) return; const y0 = y(acc + v), hh = Math.max(0, y(acc) - y0 - (k ? 2 : 0)); acc += v;
        bars += `<path d="${k === top ? rtop(cx - bw / 2, y0, bw, hh, 4) : `M${cx - bw / 2},${y0}h${bw}v${hh}h${-bw}Z`}" fill="${q.color}" class="mk" data-tip="${de(v, dec)} ${unit}|${esc(q.name)} · ${esc(l)}"/>`; });
    } else {
      const k = series.length, bw = Math.min(24, (band * .8 - (k - 1) * 2) / k), x0 = cx - (k * bw + (k - 1) * 2) / 2;
      series.forEach((q, j) => { const v = q.values[i] || 0; if (v <= 0) return; bars += `<path d="${rtop(x0 + j * (bw + 2), y(v), bw, y(0) - y(v), 4)}" fill="${q.color}" class="mk" data-tip="${de(v, dec)} ${unit}|${esc(q.name)} · ${esc(l)}"/>`; });
    }
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)}">${g}${bars}<text x="${L}" y="${T - 1}" class="un">${esc(unit)}</text></svg>`;
}

/* Linien, eine Achse, Fadenkreuz */
function lineChart({ id, W, H = 190, labels, series, unit, ref, dec = 1, area }) {
  const L = 40, R = 10, T = 12, Bm = 24, pw = W - L - R, ph = H - T - Bm, n = labels.length;
  const all = series.flatMap(q => q.values).concat(ref ? [ref.v] : []);
  let lo = Math.min(...all), hi = Math.max(...all); if (area) lo = 0;
  const span = niceMax((hi - lo) || 1) , stp = span / 4; lo = Math.floor(lo / stp) * stp; hi = lo + stp * 4; while (hi < Math.max(...all)) hi += stp;
  const x = i => L + (n === 1 ? pw / 2 : pw * i / (n - 1)), y = v => T + ph - (v - lo) / (hi - lo) * ph;
  let g = '';
  const tk = Math.round((hi - lo) / stp);
  for (let k = 0; k <= tk; k++) { const v = lo + stp * k; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="${k ? 'grid' : 'base'}"/><text x="${L - 6}" y="${y(v) + 3}" class="yt">${de(v, stp < 1 ? 1 : 0)}</text>`; }
  const step = Math.ceil(n / (W < 400 ? 5 : 10));
  labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 8}" class="xt">${esc(l)}</text>`; });
  if (ref) g += `<line x1="${L}" x2="${W - R}" y1="${y(ref.v)}" y2="${y(ref.v)}" class="refl"/><text x="${W - R}" y="${y(ref.v) - 4}" class="reft">${esc(ref.label)}</text>`;
  let ls = '';
  series.forEach(q => {
    const pts = q.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    if (area) ls += `<polygon points="${x(0)},${y(lo)} ${pts} ${x(n - 1)},${y(lo)}" fill="${q.color}" opacity=".1"/>`;
    ls += `<polyline points="${pts}" fill="none" stroke="${q.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" ${q.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
    const li = q.last != null ? q.last : n - 1;
    ls += `<circle cx="${x(li)}" cy="${y(q.values[li])}" r="4" fill="${q.color}" class="ring"/>`;
  });
  CX[id] = { L, pw, n, W, labels, series: series.map(q => ({ name: q.name, color: q.color, values: q.values })), unit, dec };
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" data-cxid="${id}">${g}${ls}<line id="${id}-x" x1="0" x2="0" y1="${T}" y2="${T + ph}" class="cross" style="display:none"/>
    <rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="transparent" data-cx="${id}"/><text x="${L}" y="${T - 2}" class="un">${esc(unit)}</text></svg>`;
}

/* Zeitleiste (ein/aus je Gerät) über 24 h */
function timeline({ id, W, rows, now }) {
  const LW = W < 400 ? 96 : 170, R = 6, T = 6, RH = 22, H = T + rows.length * RH + 22, pw = W - LW - R;
  const x = m => LW + pw * m / 1440;
  let g = `<defs><pattern id="${id}-h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="6" fill="currentColor"/></pattern></defs>`;
  [0, 360, 720, 1080, 1440].forEach(m => g += `<line x1="${x(m)}" x2="${x(m)}" y1="${T}" y2="${H - 20}" class="grid"/><text x="${x(m)}" y="${H - 6}" class="xt">${m2t(m).slice(0, 2)}</text>`);
  rows.forEach((r, i) => {
    const yy = T + i * RH;
    g += `<text x="${LW - 8}" y="${yy + 15}" class="rl">${esc(r.name.length > (W < 400 ? 13 : 24) ? r.name.slice(0, W < 400 ? 12 : 23) + '…' : r.name)}</text><rect x="${LW}" y="${yy + 5}" width="${pw}" height="12" rx="3" class="lane"/>`;
    r.segs.forEach(([a, b2, k]) => {
      const w = Math.max(1.5, x(b2) - x(a)), tip = `${m2t(a)}–${m2t(b2)} · ${de((b2 - a) / 60)} h|${esc(r.name)} · ${k === 'on' ? r.onLabel : k === 'extra' ? 'Kleidung trocknen' : 'offline'}`;
      if (k === 'off') g += `<rect x="${x(a)}" y="${yy + 5}" width="${w}" height="12" rx="3" fill="url(#${id}-h)" style="color:var(--crit)" class="mk" data-tip="${tip}"/>`;
      else if (k === 'extra') g += `<g class="mk" data-tip="${tip}" style="color:${r.color}"><rect x="${x(a)}" y="${yy + 5}" width="${w}" height="12" rx="3" fill="url(#${id}-h)"/><rect x="${x(a)}" y="${yy + 5}" width="${w}" height="12" rx="3" fill="none" stroke="${r.color}" stroke-width="1"/></g>`;
      else g += `<rect x="${x(a)}" y="${yy + 5}" width="${w}" height="12" rx="3" fill="${r.color}" class="mk" data-tip="${tip}"/>`;
    });
  });
  if (now != null) g += `<line x1="${x(now)}" x2="${x(now)}" y1="${T}" y2="${H - 20}" class="now"/><text x="${x(now)}" y="${H - 6}" class="xt now-t">jetzt</text>`;
  return `<svg class="ch" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ---------- Daten für die Diagramme ---------- */
/* Heute: Regeln im 10-Minuten-Takt durchrechnen (gleiche Logik wie die Steuerung) */
function dayRun(b) {
  const keep = S.sim.time, steps = [];
  for (let t = 0; t < 1440; t += 10) { S.sim.time = t; const C = calc(b); const st = {}; for (const k in C.st) st[k] = { on: C.st[k].on && !C.st[k].off, off: C.st[k].off, p: C.st[k].p, x: /Kleidung/.test(C.st[k].src) }; steps.push({ t, st, power: C.power }); }
  S.sim.time = keep; calc(b);
  return steps;
}
function segsOf(steps, id) {
  const out = []; let cur = null;
  steps.forEach(s => { const q = s.st[id], k = !q ? null : q.off ? 'off' : q.on ? (q.x ? 'extra' : 'on') : null;
    if (cur && cur[2] === k) cur[1] = s.t + 10; else { if (cur && cur[2]) out.push(cur); cur = [s.t, s.t + 10, k]; } });
  if (cur && cur[2]) out.push(cur);
  return out;
}
/* Mehrere Tage: aus Plan, Wetter und Geräten abgeleitete Platzhalterwerte */
function daySeries(b, n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = addDays(S.sim.date, -i), wdi = wd(d), s = b.sched[wdi], rain = rnd(d + 'r') < .35, out1 = S.sim.out - 3 + rnd(d + 'o') * 6;
    const off = !s.act || (b.hol && holName(d)) || b.vac.some(v => d >= v.from && d <= v.to) || (b.warm.act && out1 > b.warm.thr);
    const baseH = s.act ? (t2m(s.off) - t2m(s.on)) / 60 : 0;
    const row = { d, lab: d.slice(8, 10) + '.' + d.slice(5, 7) + '.', out: out1, area: {}, dev: {} };
    b.areas.forEach(a => {
      let aH = 0; a.hT = null;
      a.dev.forEach(x => {
        let h = 0;
        if (x.role === 'pump') h = 24 * 12 / 40 * (rain ? 1.35 : 1) * (.85 + rnd(d + x.id) * .3);
        else if (x.role !== 'plug' && !off && a.mode !== 'off') h = (baseH + (out1 < b.early.thr ? b.early.min / 60 : 0) + (a.dryClothes && rain ? (b.dry.after + b.dry.before) / 60 : 0)) * (a.mode === 'thermo' ? .6 + rnd(d + x.id) * .2 : 1);
        else if (x.role !== 'plug' && off && a.sensor && out1 < 2) h = 1.5 * rnd(d + x.id);
        if (i === 0 && x.off) h = 0;
        row.dev[x.id] = { h, kwh: x.fault ? h * .2 : h * x.w / 1000, cyc: x.role === 'pump' ? Math.round(h * 60 / 12) : 0 };
        if (x.role === 'heat' || x.role === 'dry') aH = Math.max(aH, h);
      });
      row.area[a.id] = { h: aH, kwh: a.dev.reduce((s2, x) => s2 + row.dev[x.id].kwh, 0), t: a.sensor ? a.t - (off ? 5 : 1.5) + rnd(d + a.id) * 2 : null };
    });
    out.push(row);
  }
  return out;
}

/* ---------- Oberfläche ---------- */
function render(fi) {
  const ui = UI[fi], b = B(), C = calc(b), sim = S.sim;
  let DR = null; const dr = () => DR || (DR = dayRun(b));
  const VIEWS = [['v1', 'Übersicht', '🏗'], ['v2', 'Heizung', '♨'], ['v3', 'Pumpen', '💧'], ['v4', 'Auswertung', '📊'], ['v5', 'Einstellungen', '⚙'], ['v6', 'Verlauf', '📈']];
  const view = (v, h) => ui.v === v ? `<div class="view on">${v === 'v6' ? '' : bsel()}${h}</div>` : '';
  const nope = (f, l) => `<div class="card info-card">${l} ist auf „${esc(b.name)}“ nicht eingeschaltet. <span class="btn flat small" data-act="goto" data-a="v5">In den Einstellungen einschalten</span></div>`;
  function bsel() {
    return `<div class="card bsel" style="margin-bottom:12px">${ct('tile (select.baustelle_aktiv)')}<span style="font-size:20px">🏗</span>
      <select data-act-change="selB">${S.bs.filter(x => !x.arch).map(x => `<option value="${x.id}" ${x.id === b.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
      ${b.fx.heat ? '<span class="chip">Heizung</span>' : ''}${b.fx.pump ? '<span class="chip">Pumpen</span>' : ''}
      ${sim.outage ? '<span class="chip red">offline</span>' : '<span class="chip grey">erreichbar</span>'}</div>`;
  }
  const devCard = (a, d, ai, di, opts = '') => {
    const st = C.st[d.id];
    const s = st.off ? (sim.outage ? 'offline (Stromausfall?)' : 'nicht erreichbar')
      : `${st.on ? (d.role === 'pump' ? 'läuft' : 'Ein') : (d.role === 'pump' ? 'steht' : 'Aus')} · ${st.p} W · heute ${de(d.kwh)} kWh · <i>${st.src}</i>`;
    const sw = d.role === 'pump' || st.off ? '' : `<span class="tgl ${st.on ? 'on' : ''}" data-act="dev" data-a="${ai}.${di}"></span>`;
    return `<div class="dev ${st.alarm ? 'bad' : ''}">${icon(d, st)}<div class="tx"><div class="n">${esc(d.n)}</div><div class="s">${s}</div>${opts}</div>${sw}${ct('eigene Karte (Animation)')}</div>`;
  };

  /* Übersicht */
  const v1 = () => `<div class="sections">
    <div class="sec">
      <div class="heading">Jetzt <span class="sub">${TAGE[sim.day]} ${m2t(sim.time)}</span></div>
      <div class="card">${ct('weather-forecast')}<div style="display:flex;align-items:center;gap:12px"><div style="font-size:38px">${sim.rain > .5 ? '🌧' : '⛅'}</div>
        <div><div class="big">${de(sim.out)} °C</div><div class="muted">Regen 24 h ${de(sim.rain)} mm · Quelle: ${b.wx.src === 'station' ? 'Wetterstation' : 'Wetter-Integration'}</div></div></div></div>
      ${C.warm ? `<div class="card info-card">☀ <b>${C.warm}</b><br><span class="muted">Heizung bleibt aus (außer Handbetrieb).</span></div>` : ''}
      ${C.pause ? `<div class="card info-card">🏖 <b>${C.pause}</b><br><span class="muted">Heizung pausiert (${{ frost: 'nur Frostschutz', off: 'alles aus', lower: 'abgesenkt' }[b.vacMode]}), Pumpen werden weiter überwacht.</span></div>` : ''}
      ${b.fx.heat ? `<div class="tile ${C.want ? 'heat' : ''}" data-act="goto" data-a="v2"><span class="ic">♨</span><div class="tx"><div class="n">Heizung</div><div class="s">${C.heatOn} von ${C.heatAll} ein · ${C.next}</div></div>${ct('tile')}</div>` : ''}
      ${b.fx.pump ? `<div class="tile ${C.warn.some(w => w.msg) ? 'bad' : 'info'}" data-act="goto" data-a="v3"><span class="ic">💧</span><div class="tx"><div class="n">Pumpen</div><div class="s">${C.pumpRun} von ${C.pumpAll} laufen</div></div>${ct('tile')}</div>` : ''}
    </div>
    <div class="sec">
      <div class="heading">Warnungen <span class="sub">${C.warn.length || 'keine'}</span></div>
      ${C.warn.length ? C.warn.map(w => `<div class="card ${w.lvl}">${ct('conditional + markdown')}<b>${esc(w.t)}</b><br><span class="muted">${w.s}</span>${w.sent ? `<br><span class="chip">📱 gemeldet an ${esc(w.sent)}</span>` : ''}</div>`).join('') : '<div class="tile ok"><span class="ic">✓</span><div class="tx"><div class="n">Alles in Ordnung</div></div></div>'}
    </div>
    <div class="sec">
      <div class="heading">Verbrauch heute</div>
      <div class="grid2">
        <div class="tile" data-act="goto" data-a="v4"><span class="ic">⚡</span><div class="tx"><div class="n">${de(C.kwh)} kWh</div><div class="s">jetzt ${de(C.power / 1000)} kW</div></div>${ct('tile')}</div>
        <div class="tile" data-act="goto" data-a="v4"><span class="ic">€</span><div class="tx"><div class="n">${eur(C.kwh * b.price)}</div><div class="s">${de(b.price, 2)} €/kWh</div></div>${ct('tile')}</div>
      </div>
    </div>
    <div class="sec span3"><div class="heading">Heute <span class="sub">wann geheizt und gepumpt wird · <span class="btn flat small" data-act="goto" data-a="v4">Auswertung</span></span></div><div class="card">${ct('history-graph (Zeitleiste)')}
      ${timeline({ id: `f${fi}tl`, W: fi === 1 ? 330 : 900, now: sim.time, rows: b.areas.flatMap(a => a.dev.filter(x => x.role !== 'plug').map(x => ({ name: `${a.name.split(' · ').pop()} · ${x.n}`, color: sc(b.areas.indexOf(a)), onLabel: x.role === 'pump' ? 'läuft' : 'heizt', segs: segsOf(dr(), x.id) }))) })}
      ${legend([...b.areas.map((a, i) => [a.name, sc(i)]), ['Kleidung trocknen', 'var(--muted)', 'hatch'], ['offline', 'var(--crit)', 'hatch']])}</div></div>
    <div class="sec span3"><div class="heading">Bereiche</div>
      <div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${b.areas.map(a => `<div class="tile ${a.on ? (a.kind === 'pump' ? 'info' : 'heat') : ''}" data-act="goto" data-a="${a.kind === 'pump' ? 'v3' : 'v2'}"><span class="ic">${a.kind === 'pump' ? '💧' : '🏠'}</span><div class="tx"><div class="n">${esc(a.name)}</div><div class="s">${a.tt !== null ? de(a.tt) + ' °C · ' : ''}${a.on}/${a.dev.length} ein · ${de(a.power / 1000)} kW</div></div>${ct('tile')}</div>`).join('')}</div>
    </div></div>`;

  /* Heizung */
  const tl = d => {
    const s = b.sched[d]; if (!s.act) return '<div class="tl hide-phone"></div>';
    const p = m => (Math.max(0, Math.min(1440, m)) / 14.4).toFixed(2), on = t2m(s.on), off = t2m(s.off);
    let h = `<i style="left:${p(on)}%;width:${p(off - on)}%"></i>`;
    if (d === sim.day) {
      if (C.early + C.earlyDry) h += `<i class="pre" style="left:${p(on - C.early - C.earlyDry)}%;width:${p(C.early + C.earlyDry)}%"></i>`;
      if (C.ext) h += `<i class="ext" style="left:${p(off)}%;width:${p(C.ext)}%"></i>`;
      h += `<b style="position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--primary-text-color);left:${p(sim.time)}%"></b>`;
    }
    return `<div class="tl hide-phone">${h}</div>`;
  };
  const sl = (path, min, max, step, unit, label, sub, ic) => { const v = get(path); return `<div class="r"><span class="ic">${ic}</span><div class="l">${label}${sub ? `<small>${sub}</small>` : ''}</div><input class="slider" type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-set="${path}"><span class="v" data-live="${unit}">${de(v, step < 1 ? 1 : 0)} ${unit}</span></div>`; };
  const heatAreas = b.areas.map((a, ai) => [a, ai]).filter(([a]) => a.dev.some(d => d.role === 'heat' || d.role === 'dry'));
  const v2 = () => !b.fx.heat ? nope('heat', 'Heizung') : `<div class="sections">
    ${C.pause ? `<div class="sec span3"><div class="card info-card">🏖 <b>${C.pause}</b> – Heizung pausiert. <span class="btn flat small" data-act="goUrlaub">Urlaub &amp; Feiertage</span></div></div>` : ''}
    <div class="sec span3"><div class="tile ${C.want ? 'heat' : ''}"><span class="ic">♨</span><div class="tx"><div class="n">Automatik (alle Container)</div><div class="s">${C.next}${C.dryOn ? ` · Kleidung trocknen −${C.earlyDry}/+${C.ext} min` : ''}${C.early ? ` · −${C.early} min Kälte` : ''}</div></div>${tgl('B.auto', b.auto)}${ct('tile (switch.baustelle_…_automatik)')}</div></div>
    ${heatAreas.map(([a, ai]) => `<div class="sec">
      <div class="heading">${esc(a.name)} <span class="sub">${a.tt !== null ? de(a.tt) + ' °C · ' + a.hum + ' %' : 'kein Fühler'}</span></div>
      <div class="card">${ct('entities (select, number)')}<div class="rows">

  </div>`;

  /* Verbrauch & Kosten */
  const v4 = () => {
    const U = usage(b, ui.scope);

    /* Zeitraum und Umfang */

    const aCol = a => sc(b.areas.indexOf(a));

    let tiles, charts = '';

      const hA = a => st.filter(q => a.dev.some(x => (x.role === 'heat' || x.role === 'dry') && q.st[x.id] && q.st[x.id].on)).length / 6;

        rows = ms.map(m => { const h = b.hist.find(q => Number(q.ym.slice(5)) === m); const k = h ? h.kwh : 0, sf = SF[m - 1];

      const sum = f => rows.reduce((s, r) => s + f(r), 0);

      const heatH = sum(r => heatAreas.reduce((s, a) => s + r.area[a.id].h, 0)), pumpH = sum(r => pumps.reduce((s, p) => s + r.dev[p.x.id].h, 0));

        ${U.rows.map(([l, ist, ohne]) => `<tr><td>${l}</td><td>${de(ist, 0)} kWh<br><span class="muted">${eur(ist * b.price)}</span></td><td>${de(ohne, 0)} kWh<br><span class="muted">${eur(ohne * b.price)}</span></td><td class="save">${eur(Math.max(0, ohne - ist) * b.price)}<br><span class="muted">${ohne ? de(Math.max(0, 1 - ist / ohne) * 100, 0) : 0} %</span></td></tr>`).join('')}</table>

      <div class="r"><span class="ic">🗓</span><div class="l">Heizperiode</div><select class="inp" data-set="B.season.0">${MON.map((m, i) => `<option value="${i + 1}" ${b.season[0] === i + 1 ? 'selected' : ''}>${m}</option>`).join('')}</select>–<select class="inp" data-set="B.season.1">${MON.map((m, i) => `<option value="${i + 1}" ${b.season[1] === i + 1 ? 'selected' : ''}>${m}</option>`).join('')}</select></div>
    </div></div>
      <div class="heading">Je Gerät (Monat)</div>
      <div class="card">${ct('entities')}<table class="t"><tr><th>Gerät</th><th>Ø Betrieb</th><th>kWh</th><th>€</th></tr>
      ${U.areas.flatMap(a => a.dev.map(d => `<tr><td>${esc(d.n)}<br><span class="muted" style="font-size:11px">${esc(a.name)}${d.typ ? ' · ' + HTYP[d.typ] : ''}</span></td><td>${de(d.w, 0)} W</td><td>${d.mon}</td><td>${eur(d.mon * b.price)}</td></tr>`)).join('')}</table></div></div>
    <div class="sec span3"><div class="heading">Vergleich Ölradiator ↔ Konvektor <span class="sub">alle Container dieser Baustelle</span></div>
      <div class="card">${ct('eigene Karte oder markdown (Vergleichs-Sensoren)')}

        ${cmp('Anzahl', 'n', x => x, '')}
        ${cmp('Ø Leistung im Betrieb', 'w', x => de(x, 0) + ' W', '–')}

        ${cmp('Aufheizen auf Soll', 'heat', x => de(x, 0) + ' min', 'weniger = schneller warm')}
        ${cmp('Abkühlen nach Aus', 'cool', x => de(x) + ' °C/h', 'weniger = hält Wärme länger')}
        ${cmp('kWh je Tag und Grad Unterschied innen/außen', 'perK', x => de(x, 2), 'weniger = fairer Vergleich')}
        </table>
        <div class="muted" style="font-size:12px;margin-top:6px">Beide wandeln Strom zu 100 % in Wärme – pro kWh gibt es keinen Unterschied. Unterschiede entstehen durch Leistung, Laufzeit, Takten am Thermostat und Wärmespeicherung. Werte hier Platzhalter.</div>
      </div></div>
  </div>`;
  };

  /* Einstellungen (in HA: Einstellungen → Geräte & Dienste → Baustelle → Konfigurieren) */
  const v5 = () => {
    const f = ui.form, U = used();
    const free = t => POOL.filter(p => (t ? t.includes(p.t) : true) && !U.has(p.e));

    const stChip = x => x.arch ? '<span class="chip grey">abgeschlossen</span>' : '<span class="chip" style="background:rgba(67,160,71,.15);color:var(--success-color)">aktiv</span>';
    const sel = (path, opts, val) => `<select class="inp" data-set="${path}">${opts.map(([k, l]) => `<option value="${k}" ${String(val) === String(k) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    const row = (ic, l, sub, ctl) => `<div class="r"><span class="ic">${ic}</span><div class="l">${l}${sub ? `<small>${sub}</small>` : ''}</div>${ctl}</div>`;
    let body = '';

    if (ui.sub === 'bs') {
      const formNewB = `<div class="form"><label>Name<input class="inp wide" data-f="name" placeholder="z. B. Wohnanlage Ost"></label>
        <label>Beginn<input class="inp wide" type="date" data-f="start" value="${sim.date}"></label>
        <label><span><input type="checkbox" data-f="heat" checked> Heizung</span></label><label><span><input type="checkbox" data-f="pump"> Pumpenüberwachung</span></label>
        <div class="muted" style="font-size:12px">Preis, Heizperiode, Empfänger und Urlaubsverhalten kommen aus „Allgemein“.</div>
        <div class="act"><span class="btn flat" data-act="cancel">Abbrechen</span><span class="btn" data-act="saveB">Anlegen</span></div></div>`;
      body = `<div class="sec span2"><div class="heading">Baustellen</div><div class="card">${ct('Integration: Einträge')}<div class="rows">
        ${S.bs.map(x => `<div class="r"><span class="ic">🏗</span><div class="l">${esc(x.name)} ${stChip(x)} ${x.id === b.id ? '<span class="chip">angezeigt</span>' : ''}
          <small>${dmy(x.start)} – ${x.arch ? dmy(x.end) : 'laufend'} · ${x.areas.length} Bereiche · ${x.areas.reduce((n, a) => n + a.dev.length, 0)} Geräte</small></div>
          <span class="btn flat small" data-act="histOf" data-a="${x.id}">Verlauf</span>
          ${x.arch ? `<span class="btn flat small" data-act="unarch" data-a="${x.id}">Wieder aktiv</span>` : `<span class="btn flat small" data-act="arch" data-a="${x.id}">Abschließen</span>`}

          ${f && f.type === 'delB' && f.id === x.id ? `<div class="form"><b>„${esc(x.name)}“ löschen?</b><label><span><input type="checkbox" data-f="keep" checked> Verbrauch und Kosten im Verlauf behalten</span></label>
            <div class="act"><span class="btn flat" data-act="cancel">Abbrechen</span><span class="btn warn" data-act="doDelB" data-a="${x.id}">Löschen</span></div></div>` : ''}`).join('')}
        ${S.kept.map((k, i) => `<div class="r"><span class="ic">📊</span><div class="l">${esc(k.name)} <span class="chip grey">gelöscht, Zahlen behalten</span><small>${de(k.kwh, 0)} kWh</small></div><span class="btn flat small" style="color:var(--error-color)" data-act="dropKept" data-a="${i}">Zahlen löschen</span></div>`).join('')}
        </div>${f && f.type === 'newB' ? formNewB : '<div style="margin-top:8px"><span class="btn" data-act="newB">+ Baustelle anlegen</span></div>'}</div></div>
        <div class="sec"><div class="heading">Status</div><div class="card" style="font-size:13px">${ct('Hinweis')}
          <b>Aktiv:</b> Automatik, Meldungen und Zähler laufen; Geräte sind dieser Baustelle zugeordnet.<br><br>
          <b>Abgeschlossen:</b> nichts wird mehr geschaltet, Geräte werden frei für die nächste Baustelle, alle Zahlen bleiben im Verlauf.<br><br>
          <b>Löschen:</b> nur wenn du willst – mit Wahl, ob die Zahlen bleiben.</div></div>`;
    }

    if (ui.sub === 'edit') body = `<div class="sec"><div class="heading">„${esc(b.name)}“</div>
      <div class="card">${ct('Optionen-Dialog')}<div class="rows">
        ${row('✎', 'Name', '', `<input class="inp" style="width:180px;text-align:left" value="${esc(b.name)}" data-set="B.name">`)}
        ${row('📅', 'Beginn', '', `<input class="inp" type="date" style="width:150px" value="${b.start}" data-set="B.start">`)}
        ${row('🏁', 'Status', 'abschließen = Geräte frei, Zahlen bleiben', `<span class="btn small flat" data-act="arch" data-a="${b.id}">Abschließen</span>`)}
        ${row('♨', 'Funktion Heizung', '', tgl('B.fx.heat', b.fx.heat))}
        ${row('💧', 'Funktion Pumpenüberwachung', '', tgl('B.fx.pump', b.fx.pump))}
        ${row('€', 'Strompreis', 'für diese Baustelle', `<input class="inp" type="number" step="0.01" value="${b.price}" data-set="B.price"><span class="v">€/kWh</span>`)}
        ${row('🗓', 'Heizperiode', '', `${sel('B.season.0', MON.map((m, i) => [i + 1, m]), b.season[0])} – ${sel('B.season.1', MON.map((m, i) => [i + 1, m]), b.season[1])}`)}
      </div></div></div>
      <div class="sec span2"><div class="heading">Container und Bereiche</div>
      ${b.areas.map((a, ai) => `<div class="card">${ct('Unter-Eintrag: Bereich (Geräte = Shellys)')}
        <div style="display:flex;align-items:center;gap:8px"><b style="flex:1">${a.kind === 'pump' ? '💧' : '🏠'} ${esc(a.name)}</b><span class="btn flat small" style="color:var(--error-color)" data-act="delA" data-a="${ai}">Entfernen</span></div>
        ${f && f.type === 'delA' && f.ai === ai ? `<div class="form"><b>„${esc(a.name)}“ mit ${a.dev.length} Geräten entfernen?</b> Die Zahlen bleiben im Verlauf.<div class="act"><span class="btn flat" data-act="cancel">Abbrechen</span><span class="btn warn" data-act="doDelA" data-a="${ai}">Entfernen</span></div></div>` : ''}
        <div class="rows">
          ${row('🌡', 'Thermostat / Fühler', 'ohne: nur Zeitplan, Heizkörper regelt selbst', `<select class="inp" data-set="B.areas.${ai}.sensor"><option value="">keiner</option>${POOL.filter(p => (p.t === 'temp' || p.t === 'climate') && (!U.has(p.e) || p.e === a.sensor)).map(p => `<option value="${p.e}" ${a.sensor === p.e ? 'selected' : ''}>${p.n}</option>`).join('')}</select>`)}
          ${a.dev.map((d, di) => row('🔌', `${esc((POOL.find(p => p.e === d.e) || { n: d.e }).n)} → ${esc(d.n)}`, `${d.e} · schaltet: ${ROLLE[d.role]}`,
            `${d.role === 'heat' ? `<span class="muted" style="font-size:11px">Typ (Vergleich)</span>${sel(`B.areas.${ai}.dev.${di}.typ`, Object.entries(HTYP), d.typ)}` : ''}<span class="btn flat small" style="color:var(--error-color)" data-act="delD" data-a="${ai}.${di}">✕</span>`)).join('')}
        </div>
        ${f && f.type === 'newD' && f.ai === ai ? `<div class="form">
          <label>Shelly – das, was geschaltet wird<select class="inp wide" data-f="e">${free(['switch']).map(p => `<option value="${p.e}">${p.n} (${p.e})</option>`).join('') || '<option value="">keiner frei</option>'}</select></label>
          <label>Was hängt dran<select class="inp wide" data-f="role">${Object.entries(ROLLE).map(([k, l]) => `<option value="${k}" ${a.kind === 'pump' && k === 'pump' ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
          <label>Bezeichnung<input class="inp wide" data-f="n" placeholder="z. B. Heizkörper 3"></label>
          <label>Heizkörper-Typ – nur für den Vergleich Ölradiator/Konvektor<select class="inp wide" data-f="typ">${Object.entries(HTYP).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
          <div class="act"><span class="btn flat" data-act="cancel">Abbrechen</span><span class="btn" data-act="saveD" data-a="${ai}">Hinzufügen</span></div></div>`
          : `<div style="margin-top:6px"><span class="btn flat small" data-act="newD" data-a="${ai}">+ Shelly</span></div>`}
      </div>`).join('')}
      ${f && f.type === 'newA' ? `<div class="form"><label>Name<input class="inp wide" data-f="name" placeholder="z. B. Container 4 · Sanitär"></label>
        <label>Art<select class="inp wide" data-f="kind"><option value="cont">Container</option><option value="pump">Pumpenschacht</option></select></label>
        <div class="act"><span class="btn flat" data-act="cancel">Abbrechen</span><span class="btn" data-act="saveA">Anlegen</span></div></div>`
        : '<div><span class="btn" data-act="newA">+ Container / Bereich</span></div>'}</div>`;

    if (ui.sub === 'wx') {
      const opt = t => POOL.filter(p => p.t === t);
      body = `<div class="sec span2"><div class="heading">Wetter für „${esc(b.name)}“</div><div class="card">${ct('Optionen-Dialog (Entitäts-Auswahl)')}<div class="rows">
        ${row('📡', 'Messwerte (Temperatur, Regen) aus', 'Wetterstation vor Ort ist genauer', sel('B.wx.src', [['weather', 'Wetter-Integration'], ['station', 'Wetterstation (Sensoren)']], b.wx.src))}
        ${b.wx.src === 'station' ? `
          ${row('🌡', 'Außentemperatur', 'Sensor der Wetterstation', `<select class="inp" data-set="B.wx.temp"><option value="">–</option>${opt('wtemp').map(p => `<option value="${p.e}" ${b.wx.temp === p.e ? 'selected' : ''}>${p.n}</option>`).join('')}</select>`)}
          ${row('💧', 'Regen letzte 24 h', 'Sensor (mm); oder Tages-Zähler', `<select class="inp" data-set="B.wx.rain"><option value="">–</option>${opt('wrain').map(p => `<option value="${p.e}" ${b.wx.rain === p.e ? 'selected' : ''}>${p.n}</option>`).join('')}</select>`)}` : ''}
        ${row('🔮', 'Vorhersage (Früh-Prognose) aus', 'kommt immer aus einer Wetter-Integration', `<select class="inp" data-set="B.wx.weather"><option value="">–</option>${opt('weather').map(p => `<option value="${p.e}" ${b.wx.weather === p.e ? 'selected' : ''}>${p.n}</option>`).join('')}</select>`)}
      </div></div></div>
      <div class="sec"><div class="heading">Bewährte Quellen</div><div class="card" style="font-size:13px">${ct('Hinweis')}
        <b>Wetter-Integration:</b> Met.no (eingebaut) mit den Koordinaten der Baustelle – eigene Instanz je Baustelle. Liefert Vorhersage, aber keinen gemessenen Regen.<br><br>
        <b>Wetterstation:</b> z. B. Ecowitt (eingebaute Integration) oder Shelly-/Zigbee-Sensoren. Liefert gemessene Temperatur und Regen – genauer für „nach Regen länger heizen“.<br><br>
        Später hinzufügen geht jederzeit: Station einrichten, hier auswählen.</div></div>`;
    }

    if (ui.sub === 'urlaub') {
      const up = holUpcoming(sim.date, 6);
      body = `<div class="sec"><div class="heading">Feiertage</div><div class="card">${ct('entities')}<div class="rows">
        ${row('🎌', 'Feiertage wie Sonntag', `${S.cfg.country} · ${S.cfg.region} – jedes Jahr berechnet (Integration „Feiertage“)`, tgl('B.hol', b.hol))}
        ${up.map(d => row('📅', holName(d), `${TAGE[wd(d)]}, ${dmy(d)}`, `<span class="btn flat small" data-act="simTo" data-a="${d}">simulieren</span>`)).join('')}
      </div></div>
      <div class="heading">Verhalten im Urlaub / an Feiertagen</div><div class="card">${ct('select')}<div class="rows">
        ${row('♨', 'Heizung', 'Pumpen werden immer weiter überwacht', sel('B.vacMode', [['frost', 'Nur Frostschutz'], ['lower', 'Absenken auf 10 °C (mit Fühler)'], ['off', 'Alles aus']], b.vacMode))}
      </div></div></div>
      <div class="sec span2"><div class="heading">Urlaub / Betriebsruhe <span class="sub">${C.vac ? '🏖 läuft gerade' : ''}</span></div>
      <div class="card">${ct('calendar (Lokaler Kalender „Baustelle Urlaub“)')}<div class="rows">
        ${b.vac.length ? b.vac.map((v, i) => row('🏖', esc(v.name), `${dmy(v.from)} – ${dmy(v.to)}${sim.date >= v.from && sim.date <= v.to ? ' · <b>aktiv</b>' : ''}`,
          `<span class="btn flat small" data-act="simTo" data-a="${v.from}">simulieren</span><span class="btn flat small" style="color:var(--error-color)" data-act="delVac" data-a="${i}">✕</span>`)).join('') : '<div class="muted">Kein Zeitraum eingetragen.</div>'}
      </div>
      ${f && f.type === 'newVac' ? `<div class="form"><label>Bezeichnung<input class="inp wide" data-f="name" placeholder="z. B. Betriebsurlaub"></label>
        <label>Von<input class="inp wide" type="date" data-f="from" value="${sim.date}"></label><label>Bis<input class="inp wide" type="date" data-f="to" value="${addDays(sim.date, 7)}"></label>
        <div class="act"><span class="btn flat" data-act="cancel">Abbrechen</span><span class="btn" data-act="saveVac">Eintragen</span></div></div>`
        : `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><span class="btn small" data-act="newVac">+ Zeitraum</span>
          <span class="btn small flat" data-act="vacPreset" data-a="xmas">Weihnachten (23.12.–06.01.)</span>
          <span class="btn small flat" data-act="vacPreset" data-a="week">Ab heute 1 Woche</span>
          ${C.vac ? '<span class="btn small warn" data-act="vacEnd">Urlaub jetzt beenden</span>' : ''}</div>`}
      <div class="muted" style="font-size:12px;margin-top:8px">Bewährt: Zeiträume als Einträge in einem lokalen HA-Kalender – auch vom Handy aus eintragbar.</div>
      </div></div>`;
    }

    if (ui.sub === 'allg') body = `<div class="sec span2"><div class="heading">Standardwerte für neue Baustellen</div><div class="card">${ct('Optionen der Integration')}<div class="rows">
        ${row('€', 'Strompreis', '', `<input class="inp" type="number" step="0.01" value="${S.cfg.price}" data-set="cfg.price"><span class="v">€/kWh</span>`)}
        ${row('🗓', 'Heizperiode', '', `${sel('cfg.season.0', MON.map((m, i) => [i + 1, m]), S.cfg.season[0])} – ${sel('cfg.season.1', MON.map((m, i) => [i + 1, m]), S.cfg.season[1])}`)}
        ${row('🏖', 'Verhalten im Urlaub', '', sel('cfg.vacMode', [['frost', 'Nur Frostschutz'], ['lower', 'Absenken'], ['off', 'Alles aus']], S.cfg.vacMode))}
        ${row('☀', 'Heizgrenze aus über', 'laut Wetterbericht', `<input class="inp" type="number" step="0.5" value="${S.cfg.warmThr}" data-set="cfg.warmThr"><span class="v">°C</span>`)}
        ${row('❄', 'Frostschutz ein unter', '', `<input class="inp" type="number" step="0.5" value="${S.cfg.frostOn}" data-set="cfg.frostOn"><span class="v">°C</span>`)}
        ${row('🎌', 'Feiertage', 'Land / Bundesland', `${sel('cfg.country', [['Österreich', 'Österreich'], ['Deutschland', 'Deutschland']], S.cfg.country)} ${sel('cfg.region', ['Steiermark', 'Wien', 'Kärnten', 'Oberösterreich', 'Niederösterreich', 'Salzburg', 'Tirol', 'Vorarlberg', 'Burgenland'].map(r => [r, r]), S.cfg.region)}`)}
        ${row('📱', 'Meldungen an', '', ['Herbert (Handy)', 'Polier (Handy)', 'Bauleitung (Handy)'].map(n => `<span class="chip ${S.cfg.notify.includes(n) ? '' : 'grey'}" data-act="cfgNotify" data-a="${n}">${n}</span>`).join(''))}
      </div></div></div>
      <div class="sec"><div class="heading">Daten</div><div class="card" style="font-size:13px">${ct('Hinweis')}
        <b>Einstellungen</b> (Baustellen, Container, Zuordnungen): in HA gespeichert, in der nächtlichen Sicherung.<br><br>
        <b>Zahlen</b> (kWh, Kosten, Temperaturen): Langzeitstatistik der HA-Datenbank – bleibt dauerhaft.<br><br>
        <b>Löschen</b> nur über „Baustellen“ – mit Rückfrage.<br><br><span class="btn small flat" data-act="export">Verlauf als CSV exportieren</span></div></div>`;

    return `<div class="sections">
      <div class="sec span3"><div class="card info-card" style="font-size:13px"><b>Brauche ich ein Einstellungsmenü?</b> In HA ist das der Knopf <b>„Konfigurieren“</b> unter Einstellungen → Geräte &amp; Dienste → Baustelle (Standard-Dialoge, nichts Eigenes). Was du oft änderst (Modus, Zeiten, Preis, Urlaub), liegt zusätzlich als Schalter/Felder direkt im Dashboard.</div></div>
      ${chips}${body}</div>`;
  };

  /* Verlauf – eine oder alle Baustellen */
  const v6 = () => {
    const all = S.bs.map((x, i) => { const k = x.hist.reduce((s, h) => s + h.kwh, 0), o = x.hist.reduce((s, h) => s + h.ohne, 0);
      return { x, i, k, o, eur: k * x.price, save: (o - k) * x.price, al: x.hist.reduce((s, h) => s + h.al, 0) }; });
    const colr = ['#03a9f4', '#ff9800', '#8e24aa', '#43a047', '#e91e63', '#607d8b'];
    const chipS = x => x.arch ? '<span class="chip grey">abgeschlossen</span>' : '<span class="chip" style="background:rgba(67,160,71,.15);color:var(--success-color)">aktiv</span>';
    const pick = `<div class="card bsel" style="margin-bottom:12px">${ct('select')}<span style="font-size:20px">📈</span><select data-act-change="hsel"><option value="all">Alle Baustellen</option>${S.bs.map(x => `<option value="${x.id}" ${ui.hsel === x.id ? 'selected' : ''}>${esc(x.name)} (${x.arch ? 'abgeschlossen' : 'aktiv'})</option>`).join('')}</select></div>`;
    if (ui.hsel === 'all' || !S.bs.some(x => x.id === ui.hsel)) {
      const yms = [...new Set(S.bs.flatMap(x => x.hist.map(h => h.ym)))].sort();
      const tot = all.reduce((s, r) => ({ k: s.k + r.k, eur: s.eur + r.eur, save: s.save + r.save }), { k: 0, eur: 0, save: 0 });
      const mx = Math.max(...yms.map(ym => S.bs.reduce((s, x) => s + ((x.hist.find(h => h.ym === ym) || {}).kwh || 0), 0)));
      return `${pick}<div class="sections">
        <div class="sec span3"><div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
          <div class="tile"><span class="ic">🏗</span><div class="tx"><div class="n">${S.bs.length} Baustellen</div><div class="s">${S.bs.filter(x => !x.arch).length} aktiv · ${S.bs.filter(x => x.arch).length} abgeschlossen</div></div></div>
          <div class="tile"><span class="ic">⚡</span><div class="tx"><div class="n">${de(tot.k, 0)} kWh</div><div class="s">gesamt</div></div></div>
          <div class="tile"><span class="ic">€</span><div class="tx"><div class="n">${eur(tot.eur)}</div><div class="s">Stromkosten gesamt</div></div></div>
          <div class="tile ok"><span class="ic">✓</span><div class="tx"><div class="n">${eur(tot.save)}</div><div class="s">gespart durch Automatik</div></div></div>
        </div></div>
        <div class="sec span3"><div class="heading">Alle Baustellen</div><div class="card" style="overflow-x:auto">${ct('eigene Karte oder markdown')}
          <table class="t"><tr><th>Baustelle</th><th class="hide-phone">Zeitraum</th><th>kWh</th><th>Kosten</th><th>gespart</th><th class="hide-phone">Meldungen</th></tr>
          ${all.map(r => `<tr data-act="hsel2" data-a="${r.x.id}" style="cursor:pointer"><td><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${colr[r.i % 6]}"></i> ${esc(r.x.name)} ${chipS(r.x)}</td><td class="hide-phone">${dmy(r.x.start)} – ${r.x.arch ? dmy(r.x.end) : 'laufend'}</td><td>${de(r.k, 0)}</td><td>${eur(r.eur)}</td><td class="save">${eur(r.save)}</td><td class="hide-phone">${r.al}</td></tr>`).join('')}
          ${S.kept.map(k => `<tr><td>${esc(k.name)} <span class="chip grey">gelöscht</span></td><td class="hide-phone">–</td><td>${de(k.kwh, 0)}</td><td>–</td><td>–</td><td class="hide-phone">–</td></tr>`).join('')}
          </table><div class="muted" style="font-size:12px;margin-top:6px">Zeile antippen = Baustelle im Detail.</div></div></div>
        <div class="sec span3"><div class="heading">Verbrauch je Monat <span class="sub">alle Baustellen</span></div><div class="card">${ct('statistics-graph (bar, gestapelt)')}
          <div class="bars" style="height:160px">${yms.map(ym => `<div class="b" title="${ym}">${S.bs.map((x, i) => { const h = x.hist.find(q => q.ym === ym); return h ? `<span style="background:${colr[i % 6]};height:${h.kwh / mx * 150}px"></span>` : ''; }).join('')}</div>`).join('')}</div>
          <div class="xlab">${yms.map((ym, i) => `<span>${i % 3 ? '' : MON[Number(ym.slice(5)) - 1] + ' ' + ym.slice(2, 4)}</span>`).join('')}</div>
          <div class="legend">${S.bs.map((x, i) => `<span><i style="background:${colr[i % 6]}"></i>${esc(x.name)}</span>`).join('')}</div></div></div>
      </div>`;
    }
    const r = all.find(q => q.x.id === ui.hsel), x = r.x, mx = Math.max(...x.hist.map(h => h.ohne), 1);
    const ev = [...x.hist.filter(h => h.al).map(h => ({ d: h.ym + '-14', t: x.fx.pump ? '📱 Pumpe offline gemeldet (Stromausfall?)' : '❄ Frostschutz hat eingegriffen' })),
      ...x.vac.map(v => ({ d: v.from, t: `🏖 Urlaub „${esc(v.name)}“ bis ${dmy(v.to)}` })), { d: x.start, t: '🏗 Baustelle angelegt' }, ...(x.arch ? [{ d: x.end, t: '🏁 Baustelle abgeschlossen' }] : [])].sort((a, c) => c.d.localeCompare(a.d));
    return `${pick}<div class="sections">
      <div class="sec span3"><div class="card" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">${ct('Kopf')}<b style="font-size:16px">${esc(x.name)}</b> ${chipS(x)}<span class="muted">${dmy(x.start)} – ${x.arch ? dmy(x.end) : 'laufend'} · ${x.hist.length} Monate · ${de(x.price, 2)} €/kWh</span>
        <span style="margin-left:auto"></span><span class="btn small flat" data-act="hsel2" data-a="all">← alle</span>${x.arch ? '' : `<span class="btn small" data-act="openB" data-a="${x.id}">Dashboard öffnen</span>`}</div></div>
      <div class="sec span3"><div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">
        <div class="tile"><span class="ic">⚡</span><div class="tx"><div class="n">${de(r.k, 0)} kWh</div><div class="s">Verbrauch</div></div></div>
        <div class="tile"><span class="ic">€</span><div class="tx"><div class="n">${eur(r.eur)}</div><div class="s">Kosten</div></div></div>
        <div class="tile ok"><span class="ic">✓</span><div class="tx"><div class="n">${eur(r.save)}</div><div class="s">gespart (${de((1 - r.k / r.o) * 100, 0)} %)</div></div></div>
        <div class="tile"><span class="ic">🔔</span><div class="tx"><div class="n">${r.al} Meldungen</div><div class="s">${x.areas.length} Bereiche · ${x.areas.reduce((n, a) => n + a.dev.length, 0)} Geräte</div></div></div>
      </div></div>
      <div class="sec span2"><div class="heading">Je Monat <span class="sub">mit Automatik / ohne</span></div><div class="card">${ct('statistics-graph (bar)')}
        <div class="bars" style="height:160px">${x.hist.map(h => `<div class="b" style="flex-direction:row;align-items:flex-end;gap:1px" title="${h.ym}: ${h.kwh} / ${h.ohne} kWh"><span class="c1" style="flex:1;height:${h.kwh / mx * 150}px"></span><span style="flex:1;height:${h.ohne / mx * 150}px;background:rgba(127,127,127,.35)"></span></div>`).join('')}</div>
        <div class="xlab">${x.hist.map(h => `<span>${MON[Number(h.ym.slice(5)) - 1]}</span>`).join('')}</div>
        <div class="legend"><span><i class="c1"></i>mit Automatik</span><span><i style="background:rgba(127,127,127,.35)"></i>ohne (24/7)</span></div></div>
        <div class="card">${ct('entities')}<table class="t"><tr><th>Monat</th><th>kWh</th><th>Kosten</th><th>gespart</th></tr>
          ${x.hist.map(h => `<tr><td>${MON[Number(h.ym.slice(5)) - 1]} ${h.ym.slice(0, 4)}</td><td>${h.kwh}</td><td>${eur(h.kwh * x.price)}</td><td class="save">${eur((h.ohne - h.kwh) * x.price)}</td></tr>`).join('')}</table></div></div>
      <div class="sec"><div class="heading">Ereignisse</div><div class="card">${ct('logbook')}<div class="rows">
        ${ev.map(e => `<div class="r"><div class="l">${e.t}<small>${dmy(e.d)}</small></div></div>`).join('')}</div></div>
        <div class="heading">Je Bereich</div><div class="card">${ct('entities')}<div class="rows">
        ${x.areas.map(a => { const k = a.dev.reduce((s, d) => s + d.mon, 0), all2 = x.areas.reduce((s, q) => s + q.dev.reduce((t, d) => t + d.mon, 0), 0) || 1; return `<div class="r"><div class="l">${esc(a.name)}<div class="hbar"><i class="c1" style="width:${k / all2 * 100}%"></i></div></div><span class="v">${de(k / all2 * r.k, 0)} kWh</span></div>`; }).join('')}</div></div></div>
    </div>`;
  };

  const sideItems = nav === 'tabs'
    ? [['v1', 'Baustelle', '🏗']]
    : VIEWS.filter(v => v[0] !== 'v5').map(([v, l, i]) => [v, v === 'v1' ? 'Baustelle' : l, i]);
  const side = `<div class="side ${ui.drawer ? 'open' : ''}"><div class="ttl">Home Assistant</div>
    <div class="it"><span class="i">▦</span>Übersicht</div><div class="it"><span class="i">⚡</span>Energie</div>
    ${sideItems.map(([v, l, i]) => `<div class="it ours ${(nav === 'tabs' ? ui.v !== 'v5' || true : ui.v === v) && (nav === 'tabs' || ui.v === v) ? 'on' : ''}" data-act="goto" data-a="${v}"><span class="i">${i}</span>${l}</div>`).join('')}
    <hr><div class="it ${nav === 'side' && ui.v === 'v5' ? 'on' : ''}" data-act="goto" data-a="v5"><span class="i">⚙</span>Einstellungen</div></div>`;
  const tabs = nav === 'tabs' ? `<div class="tabs">${VIEWS.map(([v, l]) => `<div class="tab ${ui.v === v ? 'on' : ''}" data-act="goto" data-a="${v}">${l}</div>`).join('')}</div>` : '';
  const title = nav === 'tabs' ? 'Baustelle' : (VIEWS.find(v => v[0] === ui.v) || VIEWS[0])[1];
  return `<div class="shell">${side}<div class="main">
    <div class="hdr"><div class="hdr-top"><span class="ico" data-act="drawer">☰</span><span class="t">${title}</span><span class="ico">✎</span></div>${tabs}</div>
    ${view('v1', v1())}${view('v2', v2())}${view('v3', v3())}${view('v4', v4())}${view('v5', v5())}${view('v6', v6())}
  </div></div>`;
}

/* ---------- Ablauf ---------- */
const frames = [...document.querySelectorAll('.frame')];
function draw() {
  S.sim.date = S.sim.date || '2026-09-29'; S.sim.day = wd(S.sim.date);
  if (!S.bs.some(b => b.id === S.active && !b.arch)) { const n = S.bs.find(b => !b.arch); if (n) S.active = n.id; }
  frames.forEach((f, i) => { f.innerHTML = render(i); f.classList.toggle('show-types', showTypes); });
  document.querySelectorAll('[data-sim]').forEach(el => { if (el !== document.activeElement) el.value = S.sim[el.dataset.sim]; });
  document.querySelectorAll('[data-simc]').forEach(el => el.checked = !!S.sim[el.dataset.simc]);
  document.querySelector('[data-simd]').value = S.sim.date;
  document.querySelector('[data-simv="wd"]').textContent = TAGE[S.sim.day] + (holName(S.sim.date) ? ' · ' + holName(S.sim.date) : '');
  const sv = (k, t) => document.querySelector(`[data-simv="${k}"]`).textContent = t;
  sv('time', m2t(S.sim.time)); sv('rain', de(S.sim.rain) + ' mm'); sv('fc', de(S.sim.fc) + ' °C'); sv('out', de(S.sim.out) + ' °C'); sv('dT', (S.sim.dT > 0 ? '+' : '') + de(S.sim.dT) + ' K');
  save();
}
const fv = (f, k) => { const el = f.querySelector(`[data-f="${k}"]`); return el ? (el.type === 'checkbox' ? el.checked : el.value) : ''; };
const nid = () => Math.random().toString(36).slice(2, 8);

frames.forEach((f, fi) => {
  const ui = UI[fi];
  f.addEventListener('click', e => {
    const t = e.target.closest('[data-act],[data-t]'); if (!t) return;
    const a = t.dataset.a, b = B();
    if (t.dataset.t) { set(t.dataset.t, !get(t.dataset.t)); return draw(); }
    switch (t.dataset.act) {
      case 'goto': ui.v = a; ui.drawer = false; ui.form = null; break;
      case 'drawer': ui.drawer = !ui.drawer; break;
      case 'dev': { const [ai, di] = a.split('.').map(Number), ar = b.areas[ai], d = ar.dev[di], st = calc(b).st[d.id];
        if (ar.mode !== 'hand' && d.role !== 'plug') { ar.dev.forEach(x => x.man = calc(b).st[x.id].on); ar.mode = 'hand'; toast(`${ar.name}: auf Handbetrieb gestellt`); }
        d.man = !st.on; break; }
      case 'notify': b.pr.notify = b.pr.notify.includes(a) ? b.pr.notify.filter(x => x !== a) : [...b.pr.notify, a]; break;
      case 'test': toast(b.pr.notify.length ? `Test-Meldung an ${b.pr.notify.join(', ')} gesendet (Entwurf)` : 'Kein Empfänger ausgewählt'); return;
      case 'cancel': ui.form = null; break;
      case 'newB': ui.form = { type: 'newB' }; break;
      case 'saveB': { const n = fv(f, 'name').trim(); if (!n) return toast('Bitte einen Namen eingeben');
        const x = JSON.parse(JSON.stringify(S.bs[0])); const c = S.cfg;
        Object.assign(x, { id: 'b' + nid(), name: n, arch: false, start: fv(f, 'start') || S.sim.date, end: '', hist: [], vac: [], hol: true, vacMode: c.vacMode, price: c.price, season: [...c.season],
          wx: { src: 'weather', weather: '', temp: '', rain: '' }, fx: { heat: fv(f, 'heat'), pump: fv(f, 'pump') }, auto: true, areas: [] });
        x.frost.on = c.frostOn; x.warm = { act: true, thr: c.warmThr, basis: 'now' }; x.pr.notify = [...c.notify];
        S.bs.push(x); S.active = x.id; ui.form = null; ui.v = 'v5'; ui.sub = 'edit'; toast(`Baustelle „${n}“ angelegt – jetzt Container hinzufügen`); break; }
      case 'arch': { const x = S.bs.find(y => y.id === a); x.arch = true; x.end = S.sim.date; toast(`„${x.name}“ abgeschlossen – Geräte frei, Zahlen im Verlauf`); break; }
      case 'sub': ui.sub = a; ui.form = null; break;
      case 'per': ui.per = a; break;
      case 'goUrlaub': ui.v = 'v5'; ui.sub = 'urlaub'; ui.form = null; break;
      case 'histOf': ui.v = 'v6'; ui.hsel = a; break;
      case 'hsel2': ui.hsel = a; break;
      case 'openB': S.active = a; ui.v = 'v1'; break;
      case 'simTo': S.sim.date = a; toast(`Simulation: ${dmy(a)}`); break;
      case 'newVac': ui.form = { type: 'newVac' }; break;
      case 'saveVac': { const fr = fv(f, 'from'), to = fv(f, 'to'); if (!fr || !to || to < fr) return toast('Bitte gültigen Zeitraum wählen');
        b.vac.push({ name: fv(f, 'name').trim() || 'Urlaub', from: fr, to }); b.vac.sort((x, y) => x.from.localeCompare(y.from)); ui.form = null; break; }
      case 'delVac': b.vac.splice(Number(a), 1); break;
      case 'vacPreset': { const y = Number(S.sim.date.slice(0, 4)) + (S.sim.date.slice(5) > '01-06' ? 0 : -1);
        b.vac.push(a === 'xmas' ? { name: 'Weihnachten', from: `${y}-12-23`, to: `${y + 1}-01-06` } : { name: 'Urlaub', from: S.sim.date, to: addDays(S.sim.date, 6) });
        b.vac.sort((x, z) => x.from.localeCompare(z.from)); toast('Zeitraum eingetragen'); break; }
      case 'vacEnd': { const v = b.vac.find(q => S.sim.date >= q.from && S.sim.date <= q.to); if (v) v.to = addDays(S.sim.date, -1); if (v && v.to < v.from) b.vac = b.vac.filter(q => q !== v); toast('Urlaub beendet – Zeitplan gilt wieder'); break; }
      case 'cfgNotify': S.cfg.notify = S.cfg.notify.includes(a) ? S.cfg.notify.filter(x => x !== a) : [...S.cfg.notify, a]; break;
      case 'export': toast('CSV-Export (Entwurf) – in HA: Statistik-Export'); return;
      case 'unarch': { const x = S.bs.find(y => y.id === a), u = used(); const clash = x.areas.flatMap(ar => ar.dev).filter(d => u.has(d.e));
        if (clash.length) return toast(`Geht nicht: ${clash.length} Gerät(e) sind inzwischen anderswo zugeordnet`); x.arch = false; x.end = ''; break; }
      case 'delB': ui.form = { type: 'delB', id: a }; break;
      case 'doDelB': { const x = S.bs.find(y => y.id === a); if (fv(f, 'keep')) S.kept.push({ name: x.name, kwh: x.areas.flatMap(ar => ar.dev).reduce((s, d) => s + d.mon, 0) });
        S.bs = S.bs.filter(y => y.id !== a); ui.form = null; toast(`„${x.name}“ gelöscht`); break; }
      case 'dropKept': S.kept.splice(Number(a), 1); break;
      case 'newA': ui.form = { type: 'newA' }; break;
      case 'saveA': { const n = fv(f, 'name').trim(); if (!n) return toast('Bitte einen Namen eingeben');
        const kind = fv(f, 'kind'); b.areas.push({ id: 'a' + nid(), name: n, kind, mode: kind === 'pump' ? 'off' : 'plan', target: 18, sensor: null, t: 12, hum: 60, dev: [] });
        if (kind === 'pump') b.fx.pump = true; ui.form = null; break; }
      case 'delA': ui.form = { type: 'delA', ai: Number(a) }; break;
      case 'doDelA': b.areas.splice(Number(a), 1); ui.form = null; break;
      case 'newD': ui.form = { type: 'newD', ai: Number(a) }; break;
      case 'saveD': { const e = fv(f, 'e'); if (!e) return toast('Kein freier Shelly');
        const role = fv(f, 'role'), ar = b.areas[Number(a)];
        ar.dev.push(dev(fv(f, 'n').trim() || ROLLE[role] + ' ' + (ar.dev.length + 1), role, e, { typ: role === 'heat' ? fv(f, 'typ') : undefined }));
        ui.form = null; toast('Gerät hinzugefügt – Ø Leistung wird ab jetzt gemessen'); break; }
      case 'delD': { const [ai, di] = a.split('.').map(Number); b.areas[ai].dev.splice(di, 1); break; }
      default: return;
    }
    draw();
  });
  f.addEventListener('input', e => {
    const el = e.target; if (!el.dataset.set || el.type !== 'range') return;
    const lab = el.parentNode.querySelector('[data-live]'), st = Number(el.step);
    if (lab) lab.textContent = de(Number(el.value), st < 1 ? 1 : 0) + ' ' + lab.dataset.live;
  });
  f.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.actChange === 'selB') { S.active = el.value; UI.forEach(u => { u.scope = 'all'; u.form = null; }); return draw(); }
    if (el.dataset.actChange === 'scope') { ui.scope = el.value; return draw(); }
    if (el.dataset.actChange === 'hsel') { ui.hsel = el.value; return draw(); }
    if (!el.dataset.set) return;
    let v = el.value;
    if (el.type === 'range' || el.type === 'number' || /season/.test(el.dataset.set)) v = Number(v);
    if (el.dataset.set === 'B.start' && !v) return draw();
    if (/\.sensor$/.test(el.dataset.set)) { v = v || null; const ai = Number(el.dataset.set.split('.')[2]); const ar = B().areas[ai]; if (!v && ar.mode === 'thermo') ar.mode = 'plan'; }
    set(el.dataset.set, v); draw();
  });
});

document.querySelector('[data-simd]').addEventListener('change', e => { if (e.target.value) { S.sim.date = e.target.value; draw(); } });
document.querySelectorAll('[data-sim]').forEach(el => el.addEventListener('input', () => { S.sim[el.dataset.sim] = Number(el.value); draw(); }));
document.querySelectorAll('[data-simc]').forEach(el => el.addEventListener('change', () => { S.sim[el.dataset.simc] = el.checked; draw(); }));
document.getElementById('reset').addEventListener('click', () => { S = START(); UI.forEach(u => Object.assign(u, { v: 'v1', form: null, scope: 'all', sub: 'bs', hsel: 'all' })); draw(); toast('Zurückgesetzt'); });
document.getElementById('nav').addEventListener('change', e => { nav = e.target.value; UI.forEach(u => u.drawer = false); draw(); });
const stage = document.getElementById('stage');
document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === btn));
  stage.className = 'stage ' + (btn.dataset.mode === 'both' ? '' : btn.dataset.mode);
}));
/* Tooltips: Balken/Segmente (data-tip) und Fadenkreuz (data-cx) */
const tip = document.getElementById('tip');
function showTip(e, rows) {
  tip.replaceChildren(...rows.map(([v, n, c]) => { const r = document.createElement('div'); r.className = 'tr';
    if (c) { const k = document.createElement('i'); k.style.background = c; r.appendChild(k); }
    const b1 = document.createElement('b'); b1.textContent = v; r.appendChild(b1); if (n) { const s1 = document.createElement('span'); s1.textContent = ' ' + n; r.appendChild(s1); } return r; }));
  tip.style.display = 'block';
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('pointermove', e => {
  const cx = e.target.closest && e.target.closest('[data-cx]');
  document.querySelectorAll('.cross').forEach(l => { if (!cx || l.id !== cx.dataset.cx + '-x') l.style.display = 'none'; });
  if (cx) {
    const d = CX[cx.dataset.cx], svg = cx.ownerSVGElement, r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * d.W;
    const i = Math.max(0, Math.min(d.n - 1, Math.round((vx - d.L) / d.pw * (d.n - 1)))), X = d.L + (d.n === 1 ? d.pw / 2 : d.pw * i / (d.n - 1));
    const ln = svg.querySelector('.cross'); if (ln) { ln.setAttribute('x1', X); ln.setAttribute('x2', X); ln.style.display = ''; }
    return showTip(e, [[d.labels[i], '', ''], ...d.series.map(q => [`${de(q.values[i], d.dec)} ${d.unit}`, q.name, q.color.startsWith('var') ? getComputedStyle(svg).getPropertyValue(q.color.slice(4, -1)) : q.color])]);
  }
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  const [v, n] = t.dataset.tip.split('|'); showTip(e, [[v, n, '']]);
});
document.addEventListener('pointerleave', () => tip.style.display = 'none');
document.getElementById('theme').addEventListener('click', () => { document.body.dataset.theme = document.body.dataset.theme === 'dark' ? '' : 'dark'; });
document.getElementById('types').addEventListener('click', e => { showTypes = !showTypes; e.target.classList.toggle('on', showTypes); draw(); });
draw();
</script>
</body>
</html>
